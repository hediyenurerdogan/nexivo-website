<!DOCTYPE html>

  <style>
    :root { color-scheme: dark; background: #03070b; }
    body { background-color: #03070b; color: #f4f4f5; margin: 0; overflow-x: hidden; }
    .navbar-logo-link { display: inline-flex; align-items: center; width: 118px; line-height: 1; }
    .navbar-logo-image { display: block; width: 100%; height: auto; filter: drop-shadow(0 4px 10px rgba(0,0,0,.45)); }
    .nexivo-hero { position: relative; box-sizing: border-box; min-height: 100svh; height: 100svh; overflow: hidden; display: grid; place-items: center; padding: 74px 24px 18px; isolation: isolate; background: radial-gradient(circle at 50% 64%, rgba(17,185,169,.2), transparent 18%), radial-gradient(circle at 32% 50%, rgba(46,111,255,.16), transparent 28%), linear-gradient(105deg, rgba(255,255,255,.13), transparent 19%, transparent 64%, rgba(13,199,205,.06)), #03070b; }
    .nexivo-hero::before, .nexivo-hero::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: -1; }
    .nexivo-hero::before { background: repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0 1px, transparent 1px 118px), radial-gradient(ellipse at center, transparent 42%, rgba(0,0,0,.72) 100%); opacity: .55; }
    .nexivo-hero::after { background: linear-gradient(90deg, rgba(255,255,255,.08), transparent 22%), linear-gradient(180deg, rgba(255,255,255,.08), transparent 24%); mix-blend-mode: screen; opacity: .38; }
    .hero-ambient { position: absolute; inset: 0; z-index: 0; background: radial-gradient(ellipse at 50% 72%, rgba(53,255,213,.2), transparent 23%), radial-gradient(ellipse at 62% 46%, rgba(45,118,255,.16), transparent 22%), linear-gradient(180deg, rgba(255,255,255,.06), transparent 42%); filter: blur(18px); opacity: .72; animation: ambient-breathe 8s ease-in-out infinite alternate; }
    .hero-stage { position: absolute; left: 50%; top: 50%; width: min(980px, 100vw); height: min(610px, 66vw); transform: translate(-50%, -50%); perspective: 920px; z-index: 1; }
    .hologram-platform { position: absolute; left: 50%; bottom: -18%; width: 64%; aspect-ratio: 1 / 1; transform: translateX(-50%) rotateX(70deg); transform-style: preserve-3d; border-radius: 50%; animation: platform-float 6s ease-in-out infinite alternate; }
    .platform-glow { position: absolute; inset: 31%; border-radius: 50%; background: radial-gradient(circle, #f7ffff 0 8%, #46fff0 12%, rgba(42,132,255,.45) 32%, transparent 68%); box-shadow: 0 0 28px rgba(70,255,240,.9), 0 0 96px rgba(16,185,129,.75); animation: core-pulse 2.8s ease-in-out infinite; }
    .platform-ring { position: absolute; inset: var(--ring-inset); border: 1px solid rgba(84,246,235,.58); border-radius: 50%; box-shadow: 0 0 10px rgba(34,211,238,.45); animation: ring-spin 18s linear infinite; }
    .platform-ring:nth-of-type(2n) { border-color: rgba(47,129,255,.58); animation-direction: reverse; animation-duration: 24s; }
    .platform-ring:nth-of-type(3n) { border-style: dashed; border-color: rgba(67,255,176,.52); }
    .platform-spoke { position: absolute; left: 50%; top: 50%; width: 50%; height: 1px; transform-origin: left center; transform: rotate(var(--spoke-angle)); background: linear-gradient(90deg, rgba(84,246,235,.8), rgba(40,135,255,.28), transparent); opacity: .74; }
    .platform-dot { position: absolute; left: 50%; top: 50%; width: 7px; height: 7px; border-radius: 999px; background: #78fff2; box-shadow: 0 0 14px #3df6ff, 0 0 28px rgba(16,185,129,.72); transform: rotate(var(--dot-angle)) translateX(var(--dot-radius)) translateY(var(--dot-lift)); animation: dot-spark 3.2s ease-in-out infinite; animation-delay: var(--dot-delay); }
    .light-field { position: absolute; left: 50%; bottom: -8%; width: 72%; height: 66%; transform: translateX(-50%); pointer-events: none; filter: blur(.15px); mix-blend-mode: screen; z-index: 3; }
    .light-beam { position: absolute; left: 50%; bottom: 0; width: 2px; height: var(--beam-height); transform-origin: bottom center; transform: rotate(var(--beam-angle)) translateX(var(--beam-x)); background: linear-gradient(180deg, transparent, rgba(126,255,246,.9) 45%, rgba(42,132,255,.18) 88%, transparent); box-shadow: 0 0 12px rgba(64,255,238,.84), 0 0 34px rgba(42,132,255,.55); opacity: .28; animation: beam-rise 3.8s ease-in-out infinite; animation-delay: var(--beam-delay); }
    .light-beam::after { content: ""; position: absolute; left: -3px; top: 20%; width: 7px; height: 7px; border-radius: 50%; background: #9ffff8; box-shadow: 0 0 18px #48fff2; animation: bead-travel 2.8s linear infinite; animation-delay: var(--bead-delay); }
    .cube-wrap { position: absolute; left: 50%; top: 34%; --cube-size: clamp(132px, 18vw, 220px); --cube-depth: clamp(66px, 9vw, 110px); width: var(--cube-size); aspect-ratio: 1; transform: translate(-50%, -50%); transform-style: preserve-3d; animation: cube-hover 5.5s ease-in-out infinite alternate; z-index: 2; }
    .nexivo-cube { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; animation: cube-rotate 18s linear infinite; }
    .cube-face { position: absolute; inset: 0; border: 1px solid rgba(122,255,239,.54); background: linear-gradient(135deg, rgba(75,255,202,.82), rgba(19,151,230,.78) 50%, rgba(39,89,255,.84)), linear-gradient(rgba(255,255,255,.1) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.1) 1px, transparent 1px); background-size: auto, 30px 30px, 30px 30px; box-shadow: inset 0 0 36px rgba(255,255,255,.11), 0 0 28px rgba(44,211,255,.18); opacity: .92; }
    .cube-face-front { transform: translateZ(var(--cube-depth)); }
    .cube-face-back { transform: rotateY(180deg) translateZ(var(--cube-depth)); }
    .cube-face-right { transform: rotateY(90deg) translateZ(var(--cube-depth)); }
    .cube-face-left { transform: rotateY(-90deg) translateZ(var(--cube-depth)); }
    .cube-face-top { transform: rotateX(90deg) translateZ(var(--cube-depth)); }
    .cube-face-bottom { transform: rotateX(-90deg) translateZ(var(--cube-depth)); }
    .cube-face-front::after { content: ""; position: absolute; inset: 18% 10%; background: rgba(255,255,255,.92); filter: blur(20px); opacity: .18; }
    .hero-content { position: relative; z-index: 2; width: min(980px, 100%); text-align: center; margin-top: -2vh; text-shadow: 0 18px 36px rgba(0,0,0,.55); }
    .hero-content h1 { margin: 0; color: #fff; font-size: clamp(4.6rem, 14vw, 10.2rem); line-height: .82; font-weight: 900; letter-spacing: 0; }
    .hero-logo-heading { display: flex; justify-content: center; line-height: 1; }
    .hero-logo-image { display: block; width: min(780px, 86vw); height: auto; filter: drop-shadow(0 18px 34px rgba(0,0,0,.6)); }
    .hero-kicker { margin: 0 0 18px; color: rgba(198,255,246,.86); font-size: clamp(.72rem, 1.35vw, 1rem); font-weight: 700; letter-spacing: .18em; }
    .hero-subtitle { max-width: 690px; margin: 24px auto 0; color: rgba(232,247,250,.86); font-size: clamp(1rem, 1.6vw, 1.28rem); line-height: 1.65; }
    .hero-actions { display: flex; justify-content: center; gap: 14px; margin-top: 34px; flex-wrap: wrap; }
    .hero-primary-action, .hero-secondary-action { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 0 20px; border-radius: 8px; text-decoration: none; font-weight: 800; transition: transform 180ms ease, border-color 180ms ease, background 180ms ease; }
    .hero-primary-action { color: #031012; background: linear-gradient(135deg, #77fff4, #2cf0a4); box-shadow: 0 0 28px rgba(45,240,184,.28); }
    .hero-secondary-action { color: #d9fffb; border: 1px solid rgba(133,255,240,.4); background: rgba(3,16,20,.42); backdrop-filter: blur(12px); }
    .hero-primary-action:hover, .hero-secondary-action:hover { transform: translateY(-2px); }
    .hero-data-wave { position: absolute; top: 27%; width: 38vw; height: 30vh; z-index: 1; opacity: .5; transform: rotate(-12deg); pointer-events: none; }
    .hero-data-wave-left { left: 12%; }
    .hero-data-wave-right { right: 10%; transform: scaleX(-1) rotate(-9deg); }
    .hero-data-wave span { position: absolute; left: var(--dot-x); top: 45%; width: 3px; height: 3px; border-radius: 50%; background: rgba(108,255,245,.9); box-shadow: 0 0 12px rgba(76,255,238,.8); transform: translateY(var(--dot-y)); animation: wave-flow 5.4s ease-in-out infinite; animation-delay: var(--dot-delay); }
    @keyframes ambient-breathe { from { opacity: .55; transform: scale(1); } to { opacity: .85; transform: scale(1.03); } }
    @keyframes platform-float { from { transform: translateX(-50%) rotateX(70deg) translateY(0); } to { transform: translateX(-50%) rotateX(70deg) translateY(-10px); } }
    @keyframes core-pulse { 0%, 100% { opacity: .65; transform: scale(.92); } 50% { opacity: 1; transform: scale(1.08); } }
    @keyframes ring-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes dot-spark { 0%, 100% { opacity: .22; } 50% { opacity: 1; } }
    @keyframes beam-rise { 0%, 100% { opacity: .16; transform: rotate(var(--beam-angle)) translateX(var(--beam-x)) scaleY(.82); } 45% { opacity: .82; transform: rotate(var(--beam-angle-active)) translateX(var(--beam-x)) scaleY(1.08); } }
    @keyframes bead-travel { from { transform: translateY(80px) scale(.5); opacity: 0; } 35% { opacity: 1; } to { transform: translateY(-230px) scale(1.1); opacity: 0; } }
    @keyframes cube-hover { from { transform: translate(-50%, -50%) translateY(8px); } to { transform: translate(-50%, -50%) translateY(-13px); } }
    @keyframes cube-rotate { from { transform: rotateX(-16deg) rotateY(28deg); } to { transform: rotateX(-16deg) rotateY(388deg); } }
    @keyframes wave-flow { 0%, 100% { opacity: .08; transform: translate(-18px, var(--dot-y)); } 50% { opacity: .85; transform: translate(28px, var(--dot-y-alt)); } }
    @media (max-width: 768px) { .nexivo-hero { min-height: 100svh; height: 100svh; padding: 72px 18px 18px; } .hero-stage { top: 48%; width: 112vw; height: 74vh; } .hologram-platform { width: 92%; bottom: -10%; } .light-field { width: 88%; height: 48%; bottom: 2%; } .light-beam { height: var(--beam-height-mobile); } .cube-wrap { top: 39%; } .hero-content { margin-top: -2vh; } .hero-content h1 { font-size: clamp(4rem, 20vw, 6.2rem); } .hero-logo-image { width: min(92vw, 620px); } .hero-subtitle { max-width: 34rem; } .hero-data-wave { display: none; } }
    @media (max-width: 480px) { .hero-actions { width: 100%; } .hero-primary-action, .hero-secondary-action { width: min(100%, 310px); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; } }
    .faq-item > summary { list-style: none; }

<body>
  <div id="root"></div>

  <!-- Tüm React Uygulaması Tek Dosyada -->
  <script type="text/babel" data-presets="react,typescript">
    const { useState, useEffect } = React;
    const { HashRouter, Routes, Route, Link, useLocation } = window.ReactRouterDOM;
    const platformRings = Array.from({ length: 5 }, (_, index) => index);
    const platformSpokes = Array.from({ length: 28 }, (_, index) => index);
    const lightBeams = Array.from({ length: 22 }, (_, index) => index);
    const orbitDots = Array.from({ length: 34 }, (_, index) => index);
    const dataDots = Array.from({ length: 44 }, (_, index) => index);
    const ringStyle = (index) => ({
      '--ring-inset': `${index * 8.5}%`,
    });
    const spokeStyle = (index) => ({
      '--spoke-angle': `${index * 12.857}deg`,
    });
    const dataDotStyle = (index) => ({
      '--dot-x': `${(index % 11) * 8.5}%`,
      '--dot-y': `${(index % 7 - 3) * 13}px`,
      '--dot-y-alt': `${(index % 7 - 3) * -11}px`,
      '--dot-delay': `${index * -0.08}s`,
    });
    const orbitDotStyle = (index) => ({
      '--dot-angle': `${index * 21}deg`,
      '--dot-radius': `${138 + (index % 7) * 28}px`,
      '--dot-lift': `${(index % 5) * 8}px`,
      '--dot-delay': `${index * -0.13}s`,
    });
    const beamStyle = (index) => ({
      '--beam-height': `${185 + (index % 8) * 30}px`,
      '--beam-height-mobile': `${(185 + (index % 8) * 30) * 0.72}px`,
      '--beam-angle': `${-42 + index * 4}deg`,
      '--beam-angle-active': `${-47 + index * 4.35}deg`,
      '--beam-x': `${(index % 5 - 2) * 12}px`,
      '--beam-delay': `${index * -0.18}s`,
      '--bead-delay': `${index * -0.21}s`,
    });

    // --- İkonlar (Lucide yerine inline SVG kullanıldı, dışa bağımlılığı bitirmek için) ---
    const MenuIcon = () => <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>;
    const XIcon = () => <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>;
    const FingerprintIcon = () => <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 12C2 6.48 6.48 2 12 2s10 4.48 10 10"/><path d="M5 15.5C4.5 14.5 4 13.5 4 12c0-4.42 3.58-8 8-8s8 3.58 8 8c0 1.5-.5 2.5-1 3.5"/><path d="M8.5 19c-1.5-1.5-2.5-3.5-2.5-6 0-3.31 2.69-6 6-6s6 2.69 6 6c0 2.5-1 4.5-2.5 6"/><path d="M12 15v4"/></svg>;
    const CpuIcon = () => <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/><line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="14" x2="23" y2="14"/><line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="14" x2="4" y2="14"/></svg>;
    const ShieldCheckIcon = () => <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>;

    // --- Bileşenler ---
    const Navbar = () => {
      const [isOpen, setIsOpen] = useState(false);
      const location = useLocation();
      const isActive = (path) => location.pathname === path;

      return (
        <nav className="fixed w-full top-0 z-50 flex justify-between items-center px-6 md:px-[5vw] py-3 border-b border-border-subtle bg-bg-dark/80 backdrop-blur-md">
          <div className="flex-1 flex justify-start">
            <Link to="/" onClick={() => setIsOpen(false)} className="navbar-logo-link" aria-label="NEXIVO ana sayfa">
              <img className="navbar-logo-image" src="/nexivo-logo-hero.png" alt="NEXIVO" />
            </Link>
          </div>
          
          <div className="hidden md:flex justify-center gap-8 items-center flex-1">
            <Link to="/teknoloji" className={`font-medium transition-colors ${isActive('/teknoloji') ? 'text-white' : 'text-[#a1a1aa] hover:text-white'}`}>Teknoloji</Link>
            <Link to="/vizyon" className={`font-medium transition-colors ${isActive('/vizyon') ? 'text-white' : 'text-[#a1a1aa] hover:text-white'}`}>Vizyon</Link>
            <Link to="/iletisim" className={`font-medium transition-colors ${isActive('/iletisim') ? 'text-white' : 'text-[#a1a1aa] hover:text-white'}`}>İletişim</Link>
          </div>

          <div className="flex-1 flex justify-end items-center gap-4">
            <a href="tekmer.html" className="hidden md:inline-block bg-accent-green/10 text-accent-green border border-accent-green px-5 py-2 rounded-lg font-semibold animate-pulse-border hover:bg-accent-green hover:text-black transition-all whitespace-nowrap">▶ Yatırımcı Sunumu</a>
            <button className="md:hidden text-white p-2" onClick={() => setIsOpen(!isOpen)}>
              {isOpen ? <XIcon /> : <MenuIcon />}
            </button>
          </div>

          {isOpen && (
            <div className="absolute top-full left-0 w-full bg-bg-dark/95 backdrop-blur-xl border-b border-border-subtle flex flex-col p-6 gap-6 md:hidden shadow-2xl">
              <Link to="/teknoloji" onClick={() => setIsOpen(false)} className={`text-lg font-medium ${isActive('/teknoloji') ? 'text-white' : 'text-[#a1a1aa]'}`}>Teknoloji</Link>
              <Link to="/vizyon" onClick={() => setIsOpen(false)} className={`text-lg font-medium ${isActive('/vizyon') ? 'text-white' : 'text-[#a1a1aa]'}`}>Vizyon</Link>
              <Link to="/iletisim" onClick={() => setIsOpen(false)} className={`text-lg font-medium ${isActive('/iletisim') ? 'text-white' : 'text-[#a1a1aa]'}`}>İletişim</Link>
              <a href="tekmer.html" className="bg-accent-green/10 text-accent-green border border-accent-green px-5 py-3 rounded-lg font-semibold text-center animate-pulse-border">▶ Yatırımcı Sunumu</a>
            </div>
          )}
        </nav>
      );
    };

    const Home = () => (
      <section className="nexivo-hero">
        <div className="hero-ambient" aria-hidden="true"></div>
        <div className="hero-data-wave hero-data-wave-left" aria-hidden="true">
          {dataDots.map((dot) => <span key={`left-${dot}`} style={dataDotStyle(dot)} />)}
        </div>
        <div className="hero-data-wave hero-data-wave-right" aria-hidden="true">
          {dataDots.map((dot) => <span key={`right-${dot}`} style={dataDotStyle(dot)} />)}
        </div>

        <div className="hero-stage" aria-hidden="true">
          <div className="hologram-platform">
            <div className="platform-glow"></div>
            {platformRings.map((ring) => (
              <span key={ring} className="platform-ring" style={ringStyle(ring)} />
            ))}
            {platformSpokes.map((spoke) => (
              <span key={spoke} className="platform-spoke" style={spokeStyle(spoke)} />
            ))}
            {orbitDots.map((dot) => (
              <span key={dot} className="platform-dot" style={orbitDotStyle(dot)} />
            ))}
          </div>

          <div className="light-field">
            {lightBeams.map((beam) => (
              <span key={beam} className="light-beam" style={beamStyle(beam)} />
            ))}
          </div>

          <div className="cube-wrap">
            <div className="nexivo-cube">
              <span className="cube-face cube-face-front"></span>
              <span className="cube-face cube-face-back"></span>
              <span className="cube-face cube-face-right"></span>
              <span className="cube-face cube-face-left"></span>
              <span className="cube-face cube-face-top"></span>
              <span className="cube-face cube-face-bottom"></span>
            </div>
          </div>
        </div>

        <div className="hero-content">
          <p className="hero-kicker">NEXT-GENERATION BIOMETRIC SECURITY</p>
          <h1 className="hero-logo-heading">
            <img className="hero-logo-image" src="/nexivo-logo-hero.png" alt="NEXIVO" />
          </h1>
          <p className="hero-subtitle">
            Kopyalanamaz damar biyometrisiyle kimlik doğrulamayı yeniden tasarlayan erken aşama güvenlik girişimi.
          </p>
          <div className="hero-actions">
            <a href="tekmer.html" className="hero-primary-action">Yatırımcı Sunumu</a>
            <Link to="/teknoloji" className="hero-secondary-action">Teknolojiyi İncele</Link>
          </div>
        </div>
      </section>
    );
    const Teknoloji = () => (
      <div className="min-h-[calc(100vh-70px)] py-20 px-6 md:px-[5vw]">
        <div className="max-w-5xl mx-auto">
          <h1 className="text-4xl md:text-5xl font-bold text-white mb-6">Teknoloji</h1>
          <p className="text-xl text-[#a1a1aa] mb-16 max-w-3xl leading-relaxed">
            NEXIVO, kopyalanabilir yüzey biyometrileri yerine damar yapısına dayanan, pilot uygulamalarla doğrulanabilir yeni nesil kimlik doğrulama altyapısı geliştirir.

      className: (typeof el.className === 'string') ? el.className : '',
      textContent: (el.childNodes.length === 1 && el.childNodes[0].nodeType === 3) ? (el.textContent || '').slice(0, 80) : '',
      fontSize: cs.fontSize,
      fontWeight: cs.fontWeight,
      fontFamily: cs.fontFamily,
      color: cs.color,
      backgroundColor: cs.backgroundColor,
      opacity: cs.opacity,
      textAlign: cs.textAlign,
      padding: cs.padding,
      margin: cs.margin,
      borderRadius: cs.borderRadius,
      borderWidth: cs.borderWidth,
      borderColor: cs.borderColor,
      width: cs.width,
      height: cs.height,
      display: cs.display,
    };
  }

  function parseDataDs(ds) {
    var parts = ds.split(':');
    if (parts.length < 3) return null;
    var col = parseInt(parts[parts.length - 1], 10);
    var line = parseInt(parts[parts.length - 2], 10);
    var filePath = parts.slice(0, parts.length - 2).join(':');
    if (!filePath || isNaN(line)) return null;
    return { sourceFilePath: filePath, sourceLine: line, sourceColumn: isNaN(col) ? null : col };
  }

  function getDebugSource(el) {
    var node = el;
    while (node && node !== document.documentElement) {
      if (node.getAttribute) {
        var ds = node.getAttribute('data-ds');
        if (ds) {
          var parsed = parseDataDs(ds);
          if (parsed) return parsed;
        }
      }
      node = node.parentElement;
    }

    var workDir = '/home/project/';
    function strip(f) {
      if (!f) return '';
      return f.startsWith(workDir) ? f.slice(workDir.length) : f;
    }

    try {
      var vNode = el;
      while (vNode && vNode !== document.documentElement) {
        var vc = vNode.__vueParentComponent;
        if (vc && vc.type && vc.type.__file) {
          return { sourceFilePath: strip(vc.type.__file), sourceLine: null, sourceColumn: null };
        }
        vNode = vNode.parentElement;
      }
    } catch (err) {
      console.warn('[canvas-overlay] Vue fallback error:', err);
    }

    return null;
  }

  function clearOverlayState() {
    hoveredEl = null;
    selectedEl = null;
    window.parent.postMessage({ type: 'canvas-hover-clear' }, '*');
  }

  document.addEventListener('mousemove', function(e) {
    if (!enabled) return;
    const el = document.elementFromPoint(e.clientX, e.clientY);
    if (!el || el === hoveredEl) return;
    hoveredEl = el;
    window.parent.postMessage({
      type: 'canvas-hover',
      rect: getRect(el),
      selector: getSelector(el),
    }, '*');
  }, true);

  document.addEventListener('click', function(e) {
    if (!enabled) return;
    e.preventDefault();
    e.stopPropagation();
    const el = document.elementFromPoint(e.clientX, e.clientY);
    if (!el) return;
    selectedEl = el;
    var source = getDebugSource(el);
    window.parent.postMessage({
      type: 'canvas-select',
      rect: getRect(el),
      selector: getSelector(el),
      props: getComputedProps(el),
      source: source,
    }, '*');
  }, true);

  var syncSelectRaf = 0;
  function postSelectedRectIfAny() {
    if (!selectedEl) return;
    if (!selectedEl.isConnected) {
      selectedEl = null;
      return;
    }
    window.parent.postMessage({
      type: 'canvas-select-rect',
      rect: getRect(selectedEl),
    }, '*');
  }
  function scheduleSelectedRectSync() {
    if (!enabled) return;
    if (!selectedEl) return;
    if (syncSelectRaf) return;
    syncSelectRaf = requestAnimationFrame(function() {
      syncSelectRaf = 0;
      postSelectedRectIfAny();
    });
  }
  window.addEventListener('scroll', scheduleSelectedRectSync, true);
  window.addEventListener('resize', scheduleSelectedRectSync);

  document.addEventListener('mouseleave', function() {
    if (!enabled) return;
    hoveredEl = null;
    window.parent.postMessage({ type: 'canvas-hover-clear' }, '*');
  });

  window.addEventListener('message', function(e) {
    if (e.source !== window.parent) return;
    if (!e.data) return;
    if (e.data.type === 'canvas-enable') {
      enabled = true;
    } else if (e.data.type === 'canvas-disable') {
      enabled = false;
      clearOverlayState();
    } else if (e.data.type === 'canvas-deselect') {
      selectedEl = null;
    }
  });

  window.parent.postMessage({ type: 'canvas-overlay-ready' }, '*');

  } catch (err) {
    window.parent.postMessage({ type: 'canvas-overlay-error', message: String(err) }, '*');
  }
})();

</script>
</body>
</html>
