<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXIVO | Next-Generation Biometric Security</title>
  <meta name="description" content="Biyometrik güvenlikte yeni standart: Sıfır Güven mimarisiyle tasarlanmış, deri altı damar haritalama teknolojisi." />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'bg-dark': '#09090b',
            'text-light': '#f4f4f5',
            'accent-green': '#10b981',
            'accent-purple': '#8b5cf6',
            'card-dark': '#18181b',
            'border-subtle': '#27272a',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
          animation: {
            'pulse-border': 'pulse-border 2s infinite',
            'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
          },
          keyframes: {
            'pulse-border': {
              '0%': { boxShadow: '0 0 0 0 rgba(16, 185, 129, 0.4)' },
              '70%': { boxShadow: '0 0 0 10px rgba(16, 185, 129, 0)' },
              '100%': { boxShadow: '0 0 0 0 rgba(16, 185, 129, 0)' },
            },
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },

          }
        }
      }
    }
  </script>

  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- React Router DOM CDN -->
  <script src="https://unpkg.com/@remix-run/router@1.4.0/dist/router.umd.min.js"></script>
  <script src="https://unpkg.com/react-router@6.8.1/dist/umd/react-router.production.min.js"></script>

  <!-- Babel (Tarayıcıda JSX/TS derlemek için) -->

  <style>
    body { background-color: #09090b; color: #f4f4f5; margin: 0; overflow-x: hidden; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Tüm React Uygulaması Tek Dosyada -->
  <script type="text/babel" data-presets="react,typescript">
    const { useState, useEffect } = React;
    const { HashRouter, Routes, Route, Link, useLocation } = window.ReactRouterDOM;

    // --- İkonlar (Lucide yerine inline SVG kullanıldı, dışa bağımlılığı bitirmek için) ---
    const MenuIcon = () => <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>;
    const XIcon = () => <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>;
    const FingerprintIcon = () => <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 12C2 6.48 6.48 2 12 2s10 4.48 10 10"/><path d="M5 15.5C4.5 14.5 4 13.5 4 12c0-4.42 3.58-8 8-8s8 3.58 8 8c0 1.5-.5 2.5-1 3.5"/><path d="M8.5 19c-1.5-1.5-2.5-3.5-2.5-6 0-3.31 2.69-6 6-6s6 2.69 6 6c0 2.5-1 4.5-2.5 6"/><path d="M12 15v4"/></svg>;
    const CpuIcon = () => <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/><line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="14" x2="23" y2="14"/><line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="14" x2="4" y2="14"/></svg>;
    const ShieldCheckIcon = () => <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>;

    // --- Bileşenler ---
    const Navbar = () => {
      const [isOpen, setIsOpen] = useState(false);
      const location = useLocation();
      const isActive = (path) => location.pathname === path;

      return (
        <nav className="fixed w-full top-0 z-50 flex justify-between items-center px-6 md:px-[5vw] py-3 border-b border-border-subtle bg-bg-dark/80 backdrop-blur-md">
          <div className="flex-1 flex justify-start">
            <Link to="/" onClick={() => setIsOpen(false)} className="text-2xl font-extrabold tracking-wide text-white">NEXIVO</Link>
          </div>
          
          <div className="hidden md:flex justify-center gap-8 items-center flex-1">
            <Link to="/teknoloji" className={`font-medium transition-colors ${isActive('/teknoloji') ? 'text-white' : 'text-[#a1a1aa] hover:text-white'}`}>Teknoloji</Link>
            <Link to="/vizyon" className={`font-medium transition-colors ${isActive('/vizyon') ? 'text-white' : 'text-[#a1a1aa] hover:text-white'}`}>Vizyon</Link>
            <Link to="/iletisim" className={`font-medium transition-colors ${isActive('/iletisim') ? 'text-white' : 'text-[#a1a1aa] hover:text-white'}`}>İletişim</Link>
          </div>

          <div className="flex-1 flex justify-end items-center gap-4">
            <a href="tekmer.html" className="hidden md:inline-block bg-accent-green/10 text-accent-green border border-accent-green px-5 py-2 rounded-lg font-semibold animate-pulse-border hover:bg-accent-green hover:text-black transition-all whitespace-nowrap">▶ TWINnovation Pitch</a>
            <button className="md:hidden text-white p-2" onClick={() => setIsOpen(!isOpen)}>
              {isOpen ? <XIcon /> : <MenuIcon />}
            </button>
          </div>

          {isOpen && (
            <div className="absolute top-full left-0 w-full bg-bg-dark/95 backdrop-blur-xl border-b border-border-subtle flex flex-col p-6 gap-6 md:hidden shadow-2xl">
              <Link to="/teknoloji" onClick={() => setIsOpen(false)} className={`text-lg font-medium ${isActive('/teknoloji') ? 'text-white' : 'text-[#a1a1aa]'}`}>Teknoloji</Link>
              <Link to="/vizyon" onClick={() => setIsOpen(false)} className={`text-lg font-medium ${isActive('/vizyon') ? 'text-white' : 'text-[#a1a1aa]'}`}>Vizyon</Link>
              <Link to="/iletisim" onClick={() => setIsOpen(false)} className={`text-lg font-medium ${isActive('/iletisim') ? 'text-white' : 'text-[#a1a1aa]'}`}>İletişim</Link>
              <a href="tekmer.html" className="bg-accent-green/10 text-accent-green border border-accent-green px-5 py-3 rounded-lg font-semibold text-center animate-pulse-border">▶ TWINnovation Pitch</a>
            </div>
          )}
        </nav>
      );
    };

    const Home = () => (
      <section className="min-h-[calc(100vh-70px)] flex flex-col justify-center items-center text-center px-5 py-20 bg-[radial-gradient(circle_at_center,#18181b_0%,#09090b_100%)]">
        <h1 className="text-5xl md:text-[4.5rem] mb-4 bg-gradient-to-br from-white to-[#a1a1aa] bg-clip-text text-transparent font-bold leading-tight animate-fade-in-up">
          Impossible to Spoof.
        </h1>
        <p className="text-lg md:text-[1.3rem] text-[#a1a1aa] max-w-[600px] mb-12 leading-relaxed">
          Biyometrik güvenlikte yeni standart: "Sıfır Güven" mimarisiyle tasarlanmış, deri altı damar haritalama teknolojisi.
        </p>
        
        <div className="bg-card-dark border border-accent-purple p-8 md:p-12 rounded-2xl max-w-[700px] w-full shadow-[0_20px_40px_rgba(139,92,246,0.1)] relative overflow-hidden text-left transition-transform hover:-translate-y-2">
          <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-accent-purple to-accent-green"></div>
          <div className="text-accent-purple font-bold mb-4 tracking-[2px] text-sm">ÖZEL SUNUM</div>
          <h2 className="mt-0 text-white text-2xl md:text-3xl font-bold mb-4">MEXT TWINnovation Challenge</h2>
          <p className="text-[#a1a1aa] text-base md:text-[1.1rem] mb-8 leading-relaxed">
            Ankara TEKMER Demo Day için hazırladığımız, NEXIVO'nun mimarisini ve Dinamik CVV teknolojisini detaylandıran interaktif sunumumuzu inceleyin.
          </p>
          <a href="tekmer.html" className="inline-block bg-text-light text-bg-dark px-6 py-3 rounded-lg font-bold transition-all hover:-translate-y-1 hover:shadow-[0_10px_20px_rgba(255,255,255,0.1)]">
            İnteraktif Sunumu Başlat
          </a>
        </div>
      </section>
    );

    const Teknoloji = () => (
      <div className="min-h-[calc(100vh-70px)] py-20 px-6 md:px-[5vw]">
        <div className="max-w-5xl mx-auto">
          <h1 className="text-4xl md:text-5xl font-bold text-white mb-6">Teknoloji</h1>
          <p className="text-xl text-[#a1a1aa] mb-16 max-w-3xl leading-relaxed">
            NEXIVO, geleneksel yüzey biyometrisinin ötesine geçerek deri altı damar haritalama teknolojisi ile kopyalanamaz bir güvenlik katmanı sunar.
          </p>
          <div className="grid md:grid-cols-3 gap-8">
            <div className="bg-card-dark p-8 rounded-2xl border border-border-subtle hover:border-accent-green transition-colors">
              <div className="w-14 h-14 bg-accent-green/10 rounded-xl flex items-center justify-center mb-6 text-accent-green"><FingerprintIcon /></div>
              <h3 className="text-2xl font-bold text-white mb-4">Deri Altı Haritalama</h3>
              <p className="text-[#a1a1aa] leading-relaxed">Yüzeydeki parmak izi yerine, deri altındaki benzersiz damar yapısını kızılötesi ışınlarla analiz eder. Yapay dokularla taklit edilmesi fiziksel olarak imkansızdır.</p>
            </div>
            <div className="bg-card-dark p-8 rounded-2xl border border-border-subtle hover:border-accent-purple transition-colors">
              <div className="w-14 h-14 bg-accent-purple/10 rounded-xl flex items-center justify-center mb-6 text-accent-purple"><CpuIcon /></div>
              <h3 className="text-2xl font-bold text-white mb-4">Edge AI İşlemci</h3>
              <p className="text-[#a1a1aa] leading-relaxed">Biyometrik verileriniz hiçbir zaman dış bir sunucuya aktarılmaz. Tüm eşleştirme işlemleri kartın veya cihazın içindeki güvenli yongada (On-Device) gerçekleşir.</p>
            </div>
            <div className="bg-card-dark p-8 rounded-2xl border border-border-subtle hover:border-accent-green transition-colors">
              <div className="w-14 h-14 bg-accent-green/10 rounded-xl flex items-center justify-center mb-6 text-accent-green"><ShieldCheckIcon /></div>
              <h3 className="text-2xl font-bold text-white mb-4">Zero-Trust Mimarisi</h3>
              <p className="text-[#a1a1aa] leading-relaxed">Sıfır Güven prensibiyle tasarlanan sistem, her işlemde kimliği yeniden doğrular. Şifrelerin veya PIN kodlarının çalınma riskini tamamen ortadan kaldırır.</p>
            </div>
          </div>
        </div>
      </div>
    );

    const Vizyon = () => (
      <div className="min-h-[calc(100vh-70px)] py-20 px-6 md:px-[5vw]">
        <div className="max-w-4xl mx-auto">
          <h1 className="text-4xl md:text-5xl font-bold text-white mb-6">Vizyonumuz</h1>
          <div className="text-[#a1a1aa] text-lg leading-relaxed">
            <p className="text-xl text-white mb-8">Dijital ve fiziksel dünyaların iç içe geçtiği günümüzde, kimlik doğrulama artık sadece bir güvenlik prosedürü değil, temel bir insan hakkıdır.</p>
            <div className="bg-card-dark p-8 md:p-12 rounded-2xl border border-border-subtle my-12 relative overflow-hidden">
              <div className="absolute top-0 left-0 w-2 h-full bg-accent-purple"></div>
              <h2 className="text-2xl md:text-3xl font-bold text-white mt-0 mb-4">Şifresiz Bir Gelecek</h2>
              <p>Kullanıcıların karmaşık şifreleri hatırlamak zorunda kalmadığı, kurumların veri ihlali korkusu yaşamadığı bir ekosistem inşa ediyoruz. Hedefimiz, finansal işlemlerden fiziksel erişimlere kadar her alanda, kişinin sadece "kendi olmasıyla" en yüksek güvenlik standardına ulaşmasını sağlamaktır.</p>
            </div>
            <h3 className="text-2xl font-bold text-white mb-4">Küresel Etki</h3>
            <p className="mb-6">Her yıl milyarlarca dolara ulaşan dolandırıcılık kayıplarını durdurmak için proaktif bir yaklaşım benimsiyoruz. Geliştirdiğimiz teknoloji sadece bugünün değil, önümüzdeki 10 yılın güvenlik tehditlerine karşı tasarlanmıştır.</p>
            <p>NEXIVO, biyometrik güvenlikte yeni bir çağ başlatıyor. Kopyalanamaz, çalınamaz ve devredilemez bir kimlik doğrulama standardı ile dünyayı daha güvenli bir yer haline getiriyoruz.</p>
          </div>
        </div>
      </div>
    );

    const Iletisim = () => {
      const [formData, setFormData] = useState({ name: '', email: '', subject: '', message: '' });
      const [errors, setErrors] = useState({});
      const [isSuccess, setIsSuccess] = useState(false);

      const handleChange = (e) => {
        setFormData({ ...formData, [e.target.name]: e.target.value });
        if (errors[e.target.name]) {
          setErrors({ ...errors, [e.target.name]: '' });
        }
      };

      const validate = () => {
        const newErrors = {};
        if (!formData.name.trim()) newErrors.name = 'Ad alanı zorunludur.';
        
        if (!formData.email.trim()) {
          newErrors.email = 'E-posta alanı zorunludur.';
        } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(formData.email)) {
          newErrors.email = 'Geçerli bir e-posta adresi giriniz.';
        }
        
        if (!formData.subject.trim()) newErrors.subject = 'Konu alanı zorunludur.';
        if (!formData.message.trim()) newErrors.message = 'Mesaj alanı zorunludur.';
        
        setErrors(newErrors);
        return Object.keys(newErrors).length === 0;
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        
        if (validate()) {
          const mailtoLink = `mailto:destek@nexivotr.com?subject=${encodeURIComponent(formData.subject)}&body=${encodeURIComponent(`Ad: ${formData.name}\nMesaj:\n${formData.message}`)}`;
          
          window.location.href = mailtoLink;
          
          setIsSuccess(true);
          setFormData({ name: '', email: '', subject: '', message: '' });
          
          setTimeout(() => {
            setIsSuccess(false);
          }, 5000);
        }
      };

      return (
        <div className="min-h-[calc(100vh-70px)] py-20 px-6 md:px-[5vw]">
          <div className="max-w-5xl mx-auto">
            <h1 className="text-4xl md:text-5xl font-bold text-white mb-6">İletişim</h1>
            <p className="text-xl text-[#a1a1aa] mb-16 max-w-2xl leading-relaxed">Potansiyel ortaklıklar, yatırım fırsatları ve teknik detaylar için bizimle iletişime geçebilirsiniz.</p>
            <div className="grid md:grid-cols-2 gap-12">
              <div className="space-y-8">
                <div className="bg-card-dark p-6 rounded-2xl border border-border-subtle flex items-start gap-4">
                  <div className="bg-accent-green/10 p-3 rounded-lg text-accent-green">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                  </div>
                  <div>
                    <h3 className="text-lg font-semibold text-white mb-1">E-posta</h3>
                    <a href="mailto:destek@nexivotr.com" className="text-[#a1a1aa] hover:text-accent-green transition-colors">destek@nexivotr.com</a>
                  </div>
                </div>
                <div className="bg-card-dark p-6 rounded-2xl border border-border-subtle flex items-start gap-4">
                  <div className="bg-accent-purple/10 p-3 rounded-lg text-accent-purple">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                  </div>
                  <div>
                    <h3 className="text-lg font-semibold text-white mb-1">Web Sitesi</h3>
                    <a href="https://www.nexivotr.com" target="_blank" className="text-[#a1a1aa] hover:text-accent-purple transition-colors">www.nexivotr.com</a>
                  </div>
                </div>
                <div className="bg-card-dark p-6 rounded-2xl border border-border-subtle flex items-start gap-4">
                  <div className="bg-white/5 p-3 rounded-lg text-white">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                  </div>
                  <div>
                    <h3 className="text-lg font-semibold text-white mb-1">Konum</h3>
                    <p className="text-[#a1a1aa]">Türkiye, Ankara</p>
                  </div>
                </div>
              </div>
              <div className="bg-card-dark p-8 rounded-2xl border border-border-subtle">
                <h3 className="text-2xl font-bold text-white mb-6">Bize Yazın</h3>
                <form className="space-y-4" onSubmit={handleSubmit}>
                  {isSuccess && (
                    <div className="bg-accent-green/10 border border-accent-green text-accent-green px-4 py-3 rounded-lg mb-4 font-medium">
                      Mesajınız başarıyla gönderildi, e-posta uygulamanız açılıyor...
                    </div>
                  )}
                  <div>
                    <label className="block text-sm font-medium text-[#a1a1aa] mb-2">Adınız Soyadınız</label>
                    <input 
                      type="text" 
                      name="name"
                      value={formData.name}
                      onChange={handleChange}
                      className={`w-full bg-bg-dark border ${errors.name ? 'border-red-500' : 'border-border-subtle'} rounded-lg px-4 py-3 text-white focus:outline-none focus:border-accent-green transition-colors`} 
                      placeholder="Adınız" 
                    />
                    {errors.name && <p className="text-red-500 text-sm mt-1">{errors.name}</p>}
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-[#a1a1aa] mb-2">E-posta Adresiniz</label>
                    <input 
                      type="email" 
                      name="email"
                      value={formData.email}
                      onChange={handleChange}
                      className={`w-full bg-bg-dark border ${errors.email ? 'border-red-500' : 'border-border-subtle'} rounded-lg px-4 py-3 text-white focus:outline-none focus:border-accent-green transition-colors`} 
                      placeholder="ornek@sirket.com" 
                    />
                    {errors.email && <p className="text-red-500 text-sm mt-1">{errors.email}</p>}
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-[#a1a1aa] mb-2">Konu</label>
                    <input 
                      type="text" 
                      name="subject"
                      value={formData.subject}
                      onChange={handleChange}
                      className={`w-full bg-bg-dark border ${errors.subject ? 'border-red-500' : 'border-border-subtle'} rounded-lg px-4 py-3 text-white focus:outline-none focus:border-accent-green transition-colors`} 
                      placeholder="Mesajınızın konusu" 
                    />
                    {errors.subject && <p className="text-red-500 text-sm mt-1">{errors.subject}</p>}
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-[#a1a1aa] mb-2">Mesajınız</label>
                    <textarea 
                      rows="4" 
                      name="message"
                      value={formData.message}
                      onChange={handleChange}
                      className={`w-full bg-bg-dark border ${errors.message ? 'border-red-500' : 'border-border-subtle'} rounded-lg px-4 py-3 text-white focus:outline-none focus:border-accent-green transition-colors resize-none`} 
                      placeholder="Size nasıl yardımcı olabiliriz?"
                    ></textarea>
                    {errors.message && <p className="text-red-500 text-sm mt-1">{errors.message}</p>}
                  </div>
                  <button type="submit" className="w-full bg-white text-black font-bold py-3 rounded-lg hover:bg-gray-200 transition-colors mt-2">Mesaj Gönder</button>
                </form>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const App = () => {
      return (
        <div className="font-sans">
          <Navbar />
          <main className="pt-[70px]">
            <Routes>
              <Route path="/" element={<Home />} />
              <Route path="/teknoloji" element={<Teknoloji />} />
              <Route path="/vizyon" element={<Vizyon />} />
              <Route path="/iletisim" element={<Iletisim />} />
            </Routes>
          </main>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <HashRouter>
        <App />
      </HashRouter>
    );
  </script>

<script id="dualite-canvas-overlay-v1">

(function() {
  if (window.__canvasOverlayInit) return;
  window.__canvasOverlayInit = true;

  try {

  var enabled = false;
  let hoveredEl = null;
  let selectedEl = null;

  function getSelector(el) {
    if (el.id) return '#' + el.id;
    let path = [];
    while (el && el !== document.body && el !== document.documentElement) {
      let tag = el.tagName.toLowerCase();
      let sibling = el;
      let nth = 1;
      while (sibling.previousElementSibling) {
        sibling = sibling.previousElementSibling;
        if (sibling.tagName === el.tagName) nth++;
      }
      path.unshift(nth > 1 ? tag + ':nth-of-type(' + nth + ')' : tag);
      el = el.parentElement;
    }
    return path.join(' > ');
  }

  function getRect(el) {
    const r = el.getBoundingClientRect();
    return { top: r.top, left: r.left, width: r.width, height: r.height };
  }

  function getComputedProps(el) {
    var cs = window.getComputedStyle(el);
    return {
      tagName: el.tagName.toLowerCase(),
      id: el.id || '',
      className: (typeof el.className === 'string') ? el.className : '',
      textContent: (el.childNodes.length === 1 && el.childNodes[0].nodeType === 3) ? (el.textContent || '').slice(0, 80) : '',
      fontSize: cs.fontSize,
      fontWeight: cs.fontWeight,
      fontFamily: cs.fontFamily,
      color: cs.color,
      backgroundColor: cs.backgroundColor,
      opacity: cs.opacity,
      textAlign: cs.textAlign,
      padding: cs.padding,
      margin: cs.margin,
      borderRadius: cs.borderRadius,
      borderWidth: cs.borderWidth,
      borderColor: cs.borderColor,
      width: cs.width,
      height: cs.height,
      display: cs.display,
    };
  }

  function parseDataDs(ds) {
    var parts = ds.split(':');
    if (parts.length < 3) return null;
    var col = parseInt(parts[parts.length - 1], 10);
    var line = parseInt(parts[parts.length - 2], 10);
    var filePath = parts.slice(0, parts.length - 2).join(':');
    if (!filePath || isNaN(line)) return null;
    return { sourceFilePath: filePath, sourceLine: line, sourceColumn: isNaN(col) ? null : col };
  }

  function getDebugSource(el) {
    var node = el;
    while (node && node !== document.documentElement) {
      if (node.getAttribute) {
        var ds = node.getAttribute('data-ds');
        if (ds) {
          var parsed = parseDataDs(ds);
          if (parsed) return parsed;
        }
      }
      node = node.parentElement;
    }

    var workDir = '/home/project/';
    function strip(f) {
      if (!f) return '';
      return f.startsWith(workDir) ? f.slice(workDir.length) : f;
    }

    try {
      var vNode = el;
      while (vNode && vNode !== document.documentElement) {
        var vc = vNode.__vueParentComponent;
        if (vc && vc.type && vc.type.__file) {
          return { sourceFilePath: strip(vc.type.__file), sourceLine: null, sourceColumn: null };
        }
        vNode = vNode.parentElement;
      }
    } catch (err) {
      console.warn('[canvas-overlay] Vue fallback error:', err);
    }

    return null;
  }

  function clearOverlayState() {
    hoveredEl = null;
    selectedEl = null;
    window.parent.postMessage({ type: 'canvas-hover-clear' }, '*');
  }

  document.addEventListener('mousemove', function(e) {
    if (!enabled) return;
    const el = document.elementFromPoint(e.clientX, e.clientY);
    if (!el || el === hoveredEl) return;
    hoveredEl = el;
    window.parent.postMessage({
      type: 'canvas-hover',
      rect: getRect(el),
      selector: getSelector(el),
    }, '*');
  }, true);

  document.addEventListener('click', function(e) {
    if (!enabled) return;
    e.preventDefault();
    e.stopPropagation();
    const el = document.elementFromPoint(e.clientX, e.clientY);
    if (!el) return;
    selectedEl = el;
    var source = getDebugSource(el);
    window.parent.postMessage({
      type: 'canvas-select',
      rect: getRect(el),
      selector: getSelector(el),
      props: getComputedProps(el),
      source: source,
    }, '*');
  }, true);

  var syncSelectRaf = 0;
  function postSelectedRectIfAny() {
    if (!selectedEl) return;
    if (!selectedEl.isConnected) {
      selectedEl = null;
      return;
    }
    window.parent.postMessage({
      type: 'canvas-select-rect',
      rect: getRect(selectedEl),
    }, '*');
  }
  function scheduleSelectedRectSync() {
    if (!enabled) return;
    if (!selectedEl) return;
    if (syncSelectRaf) return;
    syncSelectRaf = requestAnimationFrame(function() {
      syncSelectRaf = 0;
      postSelectedRectIfAny();
    });
  }
  window.addEventListener('scroll', scheduleSelectedRectSync, true);
  window.addEventListener('resize', scheduleSelectedRectSync);

  document.addEventListener('mouseleave', function() {
    if (!enabled) return;
    hoveredEl = null;
    window.parent.postMessage({ type: 'canvas-hover-clear' }, '*');
  });

  window.addEventListener('message', function(e) {
    if (e.source !== window.parent) return;
    if (!e.data) return;
    if (e.data.type === 'canvas-enable') {
      enabled = true;
    } else if (e.data.type === 'canvas-disable') {
      enabled = false;
      clearOverlayState();
    } else if (e.data.type === 'canvas-deselect') {
      selectedEl = null;
    }
  });

  window.parent.postMessage({ type: 'canvas-overlay-ready' }, '*');

  } catch (err) {
    window.parent.postMessage({ type: 'canvas-overlay-error', message: String(err) }, '*');
  }
})();

</script>
</body>
</html>
